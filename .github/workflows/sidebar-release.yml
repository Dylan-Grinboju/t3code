name: Sidebar fork release

on:
  push:
    branches: [sidebar-stable]
  workflow_dispatch:

concurrency:
  group: sidebar-fork-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    if: github.repository == 'Dylan-Grinboju/t3code' && github.ref == 'refs/heads/sidebar-stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      upstream: ${{ steps.release.outputs.upstream }}
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    env:
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Resolve stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream=$(jq -er '.upstreamTag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' .github/sidebar-release.json)
          revision=$(jq -er '.revision | select(type == "number" and . >= 1 and floor == .)' .github/sidebar-release.json)
          test "$(gh api "repos/pingdotgg/t3code/releases/tags/$upstream" --jq '.draft or .prerelease')" = false
          git fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "refs/tags/$upstream:refs/tags/$upstream"
          git fetch --no-tags --deepen=32 origin "$GITHUB_SHA"
          git merge-base --is-ancestor "$upstream" HEAD
          version=${upstream#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$upstream+sidebar.$revision" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci-deps

      - name: Load public connection configuration
        id: public_config
        run: |
          cp .env.example .env
          for key in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            value=$(sed -n "s/^T3CODE_$key=//p" .env.example)
            echo "$(echo "$key" | tr '[:upper:]' '[:lower:]')=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Install build and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config patchelf
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Validate sidebar changes against stable
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream }}
        run: vp run check:changed "$UPSTREAM_TAG" --concurrency 1

      - name: Align package versions
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build shared desktop bundle
        run: vp run build:desktop

      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build WSL runtime
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"
          node scripts/apply-web-brand-assets.ts production apps/server/dist/client
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 3

  mac:
    needs: bundle
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: macOS ARM64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      launch_check: true
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  windows:
    needs: bundle
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}

  publish:
    needs: [bundle, mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.bundle.outputs.version }}
      RELEASE_TAG: ${{ needs.bundle.outputs.tag }}
      UPSTREAM_TAG: ${{ needs.bundle.outputs.upstream }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Validate complete release assets
        working-directory: release
        run: |
          set -euo pipefail
          test -s "T3-Code-$VERSION-arm64.dmg"
          test -s "T3-Code-$VERSION-arm64.zip"
          test -s "T3-Code-$VERSION-x64.exe"
          test -s latest-mac.yml
          test -s latest-win-x64.yml
          mv latest-win-x64.yml latest.yml
          rm -f builder-debug.yml builder-effective-config.yaml
          sha256sum ./* > SHA256SUMS

      - name: Publish unsigned installers
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Based on [T3 Code $UPSTREAM_TAG](https://github.com/pingdotgg/t3code/releases/tag/$UPSTREAM_TAG), with sidebar status strip and optional left-edge hover expansion. Switching chats during hover keeps the sidebar temporary.

          Downloads: Mac Apple Silicon (.dmg or .zip) and Windows x64 (.exe, including the WSL runtime). Both builds are unsigned. macOS updates require downloading and replacing the app manually; chat data is stored separately. Checksums are in SHA256SUMS.
          EOF
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "T3 Code $VERSION — Sidebar edition" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
